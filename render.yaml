# Blueprint de produção para https://render.com
# O token Telegram é configurado pela interface web e guardado em /var/data.
services:
  - type: web
    name: alerta-bilhetes-sporting
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    rootDir: web
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ACCESS_CODE
        sync: false
      - key: APP_SECRET
        generateValue: true
    disk:
      name: sporting-alerta-data
      mountPath: /var/data
      sizeGB: 1
