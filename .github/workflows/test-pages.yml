name: Testar GitHub Pages

on:
  pull_request:
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/test-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar gerador e dados
        run: python -m unittest discover -s pages -p 'test_*.py' -v
      - name: Validar JavaScript
        run: node --check pages/public/app.js
      - name: Gerar site sem Internet
        run: python pages/build_site.py --offline
      - name: Confirmar ficheiros publicados
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/games.json
