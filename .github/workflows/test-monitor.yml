name: Testar monitor Sporting
on:
  pull_request:
    paths:
      - "monitor.py"
      - "sporting_data.py"
      - "test_monitor.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/test-monitor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Testar API simulada, horários e histórico
        run: |
          python -m py_compile sporting_data.py monitor.py test_monitor.py
          python -m unittest -v test_monitor
