name: Testar monitor Sporting

on:
  pull_request:
    paths:
      - "monitor.py"
      - "test_monitor.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/test-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do monitor
        run: python -m pip install requests
      - name: Validar sintaxe Python
        run: python -m py_compile monitor.py test_monitor.py
      - name: Testar horários, redundância e alertas Telegram
        run: python -m unittest -v test_monitor
