name: Bilheteira Sporting CP
on:
  schedule:
    # Verificação de hora a hora (Lisboa); minuto :17 reduz congestionamento.
    - cron: "17 * * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilheteira-sporting-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests

      - name: Testes do monitor
        run: |
          python -m py_compile monitor.py sporting_data.py test_monitor.py
          python -m unittest -v test_monitor

      - name: Consultar API e notificar alterações
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar referência e histórico
        run: |
          git config user.name "bilheteira-bot"
          git config user.email "actions@github.com"
          git add baseline.json history.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "baseline: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
