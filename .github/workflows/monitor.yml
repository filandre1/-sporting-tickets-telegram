name: Bilheteira Sporting CP
on:
  schedule:
    # Verificações às 10:17, 10:47, 11:17, 11:47, 12:17 e 12:47 (Lisboa).
    # Evita o minuto :00, sujeito a congestionamento no GitHub Actions.
    - cron: "17,47 10-12 * * *"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilheteira-sporting-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Validar sintaxe Python
        run: python -m py_compile monitor.py

      - name: Registar início e atraso da verificação
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Horário previsto: ${SCHEDULE_EXPR:-execução manual}"
          echo "Início real UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Início real Lisboa: $(TZ=Europe/Lisbon date +%Y-%m-%dT%H:%M:%S%z)"
          {
            echo "## Bilheteira Sporting CP — verificação"
            echo ""
            echo "- **Evento:** ${{ github.event_name }}"
            echo "- **Horário cron:** ${SCHEDULE_EXPR:-execução manual}"
            echo "- **Início real (Lisboa):** $(TZ=Europe/Lisbon date +'%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar bilheteira e enviar alerta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar baseline atualizado
        run: |
          git config user.name "bilheteira-bot"
          git config user.email "actions@github.com"
          git add baseline.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "baseline: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
