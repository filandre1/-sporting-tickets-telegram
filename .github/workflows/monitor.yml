name: Bilheteira Sporting CP
on:
  schedule:
    # Verificações de 30 em 30 minutos, sujeitas a atrasos do GitHub Actions.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilheteira-sporting-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Validar sintaxe Python
        run: python -m py_compile monitor.py

      - name: Verificar bilheteira e enviar alerta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar baseline atualizado
        run: |
          git config user.name "bilheteira-bot"
          git config user.email "actions@github.com"
          git add baseline.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "baseline: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
